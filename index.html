<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>科学伦理观察</title>
    <script>
      // GitHub Pages SPA fallback: restore the original route after redirect from 404.html
      (function () {
        var p = sessionStorage.getItem('gh-spa-redirect');
        if (p) {
          sessionStorage.removeItem('gh-spa-redirect');
          history.replaceState(null, '', p);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
