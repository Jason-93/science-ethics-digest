<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>科学伦理观察</title>
    <script>
      // GitHub Pages SPA fallback: restore the original route after redirect from 404.html
      (function () {
        var p = sessionStorage.getItem('gh-spa-redirect');
        if (p) {
          sessionStorage.removeItem('gh-spa-redirect');
          history.replaceState(null, '', p);
        }
      })();
    </script>
    <style>
      body { font-family: Georgia, 'Noto Serif SC', serif; background: #fafaf9; color: #44403c; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
      .msg { text-align: center; }
    </style>
  </head>
  <body>
    <div class="msg">
      <p>页面不存在，正在返回首页…</p>
      <p><a href="/science-ethics-digest/">返回科学伦理观察首页</a></p>
    </div>
    <script>
      (function () {
        var base = '/science-ethics-digest';
        var path = window.location.pathname;
        var route = path.startsWith(base) ? path.slice(base.length) : path;
        if (!route || route === '/') route = '/';
        sessionStorage.setItem('gh-spa-redirect', base + route + window.location.search + window.location.hash);
        window.location.replace(base + '/');
      })();
    </script>
  </body>
</html>
